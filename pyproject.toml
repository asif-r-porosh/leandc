[project]
name = "leandc"
version = "0.1.0"
description = "Lean desktop commander: shell and file tools for Claude over MCP"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0"]

[project.scripts]
leandc = "leandc.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leandc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
